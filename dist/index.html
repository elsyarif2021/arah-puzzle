<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141624">
<meta name="description" content="Bebaskan semua panah dalam puzzle logika Arah.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=3">
<title>Arah — Puzzle Panah</title>
<script type="module" src="app.mjs?v=3"></script>
</head>
<body>
<header class="header">
  <div class="brand"><img src="icon-192.png" alt="" width="42" height="42"><div><strong>arah<span>.</span></strong><small>PUZZLE PANAH</small></div></div>
  <button id="install" class="quiet" type="button">↓ <span>Pasang aplikasi</span></button>
</header>
<main>
  <section class="intro">
    <div class="tabs" aria-label="Mode permainan"><button id="campaign" aria-pressed="true">Level</button><button id="daily" aria-pressed="false">Harian</button></div>
    <h1>Bebaskan <em>panah.</em></h1>
    <p>Buka jalan panah dan uji pengetahuanmu tentang Al-Qur’an.</p>
  </section>
  <section class="game" aria-label="Puzzle panah">
    <div class="stats">
      <button class="quiet level" id="levels" aria-haspopup="dialog">Level <strong id="level-label">01</strong><span id="difficulty"></span> <span aria-hidden="true">⌄</span></button>
      <div class="progress"><div><span>Panah keluar</span><strong id="count"></strong></div><progress id="progress" value="0" max="1"></progress></div>
      <div class="health" id="hearts"></div>
    </div>
    <div class="board-wrap"><svg id="board" aria-label="Papan permainan"></svg></div>
    <p id="status" role="status">Pilih panah yang jalan keluarnya bebas.</p>
    <div class="actions">
      <button class="quiet" id="reset">↻ <span>Ulangi</span></button>
      <button class="quiet" id="clear" hidden>Singkirkan penghalang</button>
      <button class="accent" id="hint">Petunjuk</button>
    </div>
  </section>
  <footer><a href="arah-pwa.zip" download style="color:inherit">Unduh kode sumber</a><button class="quiet" id="sound" aria-pressed="true">Suara aktif</button><span id="connection">Menyiapkan mode offline…</span></footer>
</main>
<dialog id="dialog"><div class="dialog-top"><h2 id="dialog-title"></h2><button class="quiet" id="close" aria-label="Tutup">×</button></div><div id="dialog-content"></div></dialog>
</body>
</html>
